apiVersion: v1
kind: ServiceAccount
metadata:
  name: genomics-agent-ksa
  annotations:
    iam.gke.io/gcp-service-account: firebase-adminsdk-fbsvc@${GOOGLE_CLOUD_PROJECT}.iam.gserviceaccount.com

---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: genomics-backend-config
spec:
  securityPolicy:
    name: "genomics-security-policy"
  iap:
    enabled: true
    oauthclientCredentials:
      secretName: iap-oauth-secret
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 60

---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: genomics-managed-cert
spec:
  domains:
    - ${PUBLIC_API_DOMAIN}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genomics-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: genomics-agent
  template:
    metadata:
      labels:
        app: genomics-agent
    spec:
      serviceAccountName: genomics-agent-ksa
      nodeSelector:
        cloud.google.com/gke-nodepool: genomics-n2d-pool
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "genomics"
          effect: "NoSchedule"
      containers:
        - name: genomics-agent
          image: ${GOOGLE_CLOUD_LOCATION}-docker.pkg.dev/${GOOGLE_CLOUD_PROJECT}/prod/genomics-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GOOGLE_CLOUD_PROJECT
              value: "${GOOGLE_CLOUD_PROJECT}"
            - name: GCP_PROJECT_ID
              value: "${GOOGLE_CLOUD_PROJECT}"
            - name: PUBLIC_API_PREFIX
              value: "${PUBLIC_API_PREFIX}"
            - name: CORS_PRODUCTION_ORIGINS
              value: "${CORS_PRODUCTION_ORIGINS}"
            - name: ALLOWED_AUTH_DOMAINS
              value: "${ALLOWED_AUTH_DOMAINS}"
            - name: AGENT_ENGINE_ID
              value: "${AGENT_ENGINE_ID}"
            - name: USE_VERTEX_AI_SESSIONS
              value: "${USE_VERTEX_AI_SESSIONS}"
            - name: VERTEX_AI_LOCATION
              value: "${GOOGLE_CLOUD_LOCATION}"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key-secret
                  key: key
            - name: TASKS_QUEUE_LOCATION
              value: "${GOOGLE_CLOUD_LOCATION}"
            - name: TASKS_QUEUE_NAME
              value: "${TASKS_QUEUE_NAME}"
            - name: WORKER_URL
              value: "${WORKER_URL}"
            - name: VEP_FORK_COUNT
              value: "${VEP_FORK_COUNT}"
            - name: SHARED_VCF_BUCKET
              value: "${SHARED_VCF_BUCKET}"
            - name: GRPC_DNS_RESOLVER
              value: "${GRPC_DNS_RESOLVER}"
          resources:
            requests:
              cpu: "20"
              memory: "120Gi"
            limits:
              cpu: "24"
              memory: "224Gi"
          volumeMounts:
            - name: vep-cache
              mountPath: /mnt/cache
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
      volumes:
        - name: vep-cache
          gcePersistentDisk:
            pdName: vep-cache-disk
            fsType: ext4
            readOnly: true

---
apiVersion: v1
kind: Service
metadata:
  name: genomics-agent-service
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
    cloud.google.com/backend-config: '{"default": "genomics-backend-config"}'
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: genomics-agent
